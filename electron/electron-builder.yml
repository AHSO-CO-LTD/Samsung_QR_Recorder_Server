appId: vn.ahso.samsung.qrrecorder.server
productName: QR Recorder Server
directories:
  output: ../release
asar: true
files:
  - dist/**/*
  - package.json
extraResources:
  - from: ../release-runtime
    to: runtime
  - from: ../setup
    to: setup
  - from: ../shared/favicon.ico
    to: favicon.ico
win:
  icon: ../shared/favicon.ico
  requestedExecutionLevel: requireAdministrator
  target:
    - nsis
nsis:
  installerIcon: ../shared/favicon.ico
  uninstallerIcon: ../shared/favicon.ico
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  runAfterFinish: false
  include: ../setup/windows/installer.nsh
