<!DOCTYPE html>
<!-- activation.html — Màn hình kích hoạt mẫu (renderer).
     Giao tiếp với main process qua window.licenseAPI (định nghĩa trong preload.js). -->
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'" />
  <title>Kích hoạt sản phẩm</title>
  <style>
    body { font-family: system-ui, "Segoe UI", sans-serif; max-width: 520px; margin: 40px auto; padding: 0 24px; color: #1a1a1a; }
    h1 { font-size: 20px; }
    .box { background: #f5f6f8; border-radius: 10px; padding: 16px; margin: 16px 0; }
    .mid { font-family: ui-monospace, monospace; font-size: 18px; letter-spacing: 1px; }
    textarea { width: 100%; height: 90px; font-family: ui-monospace, monospace; font-size: 12px; box-sizing: border-box; }
    button { padding: 10px 18px; border: 0; border-radius: 8px; background: #2563eb; color: #fff; font-size: 14px; cursor: pointer; }
    button.ghost { background: #e5e7eb; color: #111; }
    .msg { margin-top: 12px; font-size: 14px; }
    .err { color: #b91c1c; } .ok { color: #15803d; }
  </style>
</head>
<body>
  <h1>Kích hoạt sản phẩm</h1>

  <div class="box">
    <div>Mã máy của bạn (gửi cho nhà cung cấp để nhận mã kích hoạt):</div>
    <div class="mid" id="machineId">…</div>
    <button class="ghost" id="copyBtn" style="margin-top:10px" disabled>Sao chép mã máy</button>
  </div>

  <div class="box">
    <div>Dán mã kích hoạt nhận được:</div>
    <textarea id="licInput" placeholder="Dán chuỗi license ở đây…"></textarea>
    <button id="activateBtn" style="margin-top:10px">Kích hoạt</button>
    <div class="msg" id="msg"></div>
  </div>

  <script>
    const MESSAGES = {
      chu_ky_sai: "Mã kích hoạt không hợp lệ hoặc đã bị chỉnh sửa.",
      sai_may: "Mã kích hoạt này thuộc về máy khác.",
      sai_san_pham: "Mã kích hoạt này không dùng cho sản phẩm này.",
      het_han: "Bản dùng thử đã hết hạn.",
      can_nang_cap_license: "License không hỗ trợ phiên bản này. Vui lòng nâng cấp.",
      can_gia_han_de_dung_ban_moi: "Cần gia hạn để dùng bản mới hơn.",
      license_hong_dinh_dang: "Chuỗi kích hoạt sai định dạng.",
      license_qua_ngan: "Chuỗi kích hoạt quá ngắn, có thể đã bị cắt khi dán.",
      payload_hong: "Nội dung mã kích hoạt bị hỏng.",
      public_key_chua_cau_hinh: "Ứng dụng chưa cấu hình khóa. Liên hệ hỗ trợ.",
    };

    async function init() {
      try {
        const id = await window.licenseAPI.getMachineId();
        document.getElementById("machineId").textContent = id;
        document.getElementById("copyBtn").disabled = false;
      } catch (e) {
        document.getElementById("machineId").textContent = "(lỗi)";
        setMsg("Không lấy được mã máy. Vui lòng khởi động lại ứng dụng.", "err");
      }
    }
    document.getElementById("copyBtn").onclick = async () => {
      const id = document.getElementById("machineId").textContent;
      await window.licenseAPI.copyToClipboard(id);
      setMsg("Đã sao chép mã máy.", "ok");
    };
    document.getElementById("activateBtn").onclick = async () => {
      const lic = document.getElementById("licInput").value.trim();
      if (!lic) return setMsg("Vui lòng dán mã kích hoạt.", "err");
      const r = await window.licenseAPI.activate(lic);
      if (r.ok) {
        setMsg("Kích hoạt thành công! Đang mở ứng dụng…", "ok");
        setTimeout(() => window.licenseAPI.onActivated(), 800);
      } else {
        setMsg(MESSAGES[r.why] || ("Lỗi: " + r.why), "err");
      }
    };
    function setMsg(t, cls) {
      const el = document.getElementById("msg");
      el.textContent = t; el.className = "msg " + (cls || "");
    }
    init();
  </script>
</body>
</html>
