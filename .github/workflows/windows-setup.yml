name: Build Windows setup

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 0.2.0 or v0.2.0. Leave empty to use package.json."
        required: false
        type: string
      prerelease:
        description: "Mark the GitHub Release as prerelease."
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve release metadata
        id: release_meta
        shell: pwsh
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          $package = Get-Content -Raw package.json | ConvertFrom-Json
          $rawVersion = $env:INPUT_VERSION
          if ([string]::IsNullOrWhiteSpace($rawVersion)) {
            if ($env:GITHUB_REF_TYPE -eq "tag") {
              $rawVersion = $env:GITHUB_REF_NAME
            } else {
              $rawVersion = $package.version
            }
          }

          $version = $rawVersion.Trim()
          if ($version.StartsWith("v")) {
            $version = $version.Substring(1)
          }
          if ($version -notmatch '^\d+\.\d+\.\d+([-.+][0-9A-Za-z.-]+)?$') {
            throw "Invalid release version '$rawVersion'. Use a semantic version such as 0.2.0."
          }

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag_name=v$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "release_title=QR Recorder Server v$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Sync package versions for release build
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release_meta.outputs.version }}
        run: |
          $files = @("package.json", "electron/package.json")
          foreach ($file in $files) {
            $json = Get-Content -Raw $file | ConvertFrom-Json
            $json.version = $env:RELEASE_VERSION
            $json | ConvertTo-Json -Depth 10 | Set-Content -Encoding UTF8 $file
          }

      - name: Create release tag for manual dispatch
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          TAG_NAME: ${{ steps.release_meta.outputs.tag_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          $remoteTag = git ls-remote --tags origin "refs/tags/$env:TAG_NAME"
          if ($remoteTag) {
            Write-Host "Tag $env:TAG_NAME already exists. Release assets will be replaced."
          } else {
            git tag $env:TAG_NAME
            git push origin $env:TAG_NAME
          }

      - name: Build Windows installer
        run: npm run dist:win
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          UPDATE_REPOSITORY: AHSO-CO-LTD/Samsung_QR_Recorder_Server

      - name: Upload setup artifact
        uses: actions/upload-artifact@v4
        with:
          name: qr-recorder-server-windows-setup
          path: |
            release/QR Recorder Server Setup *.exe
            release/QR Recorder Server Setup *.exe.blockmap
            !release/*.__uninstaller.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.release_meta.outputs.tag_name }}
          RELEASE_TITLE: ${{ steps.release_meta.outputs.release_title }}
          PRERELEASE: ${{ github.event.inputs.prerelease }}
        run: |
          $assets = Get-ChildItem -Path release -File | Where-Object {
            ($_.Name -like "QR Recorder Server Setup *.exe" -and $_.Name -notlike "*.__uninstaller.exe") -or
            $_.Name -like "QR Recorder Server Setup *.exe.blockmap"
          }
          if (-not $assets) {
            throw "No release assets found."
          }

          gh release view $env:TAG_NAME *> $null
          if ($LASTEXITCODE -ne 0) {
            $createArgs = @("release", "create", $env:TAG_NAME, "--title", $env:RELEASE_TITLE, "--generate-notes")
            if ($env:PRERELEASE -eq "true") {
              $createArgs += "--prerelease"
            }
            & gh @createArgs
          }

          gh release upload $env:TAG_NAME @($assets.FullName) --clobber
